<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#444444" stroke="#666666" stroke-width="2"/>
  
  <!-- Robot body -->
  <rect x="70" y="60" width="60" height="80" rx="10" fill="#66ccff" stroke="#3399cc" stroke-width="2"/>
  
  <!-- Head -->
  <circle cx="100" cy="45" r="15" fill="#66ccff" stroke="#3399cc" stroke-width="2"/>
  
  <!-- Eyes -->
  <circle cx="93" cy="42" r="3" fill="#ffffff"/>
  <circle cx="107" cy="42" r="3" fill="#ffffff"/>
  <circle cx="93" cy="42" r="1.5" fill="#000000"/>
  <circle cx="107" cy="42" r="1.5" fill="#000000"/>
  
  <!-- Arms -->
  <line x1="70" y1="70" x2="40" y2="80" stroke="#66ccff" stroke-width="8" stroke-linecap="round"/>
  <line x1="130" y1="70" x2="160" y2="80" stroke="#66ccff" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Legs -->
  <line x1="85" y1="140" x2="80" y2="170" stroke="#66ccff" stroke-width="8" stroke-linecap="round"/>
  <line x1="115" y1="140" x2="120" y2="170" stroke="#66ccff" stroke-width="8" stroke-linecap="round"/>
  
  <!-- AI Brain Symbol -->
  <g transform="translate(100, 100)">
    <circle r="15" fill="none" stroke="#ffcc00" stroke-width="2"/>
    <path d="M-8,-8 Q0,-15 8,-8 M-8,8 Q0,15 8,8 M-12,0 H12" stroke="#ffcc00" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="190" text-anchor="middle" font-family="Arial" font-size="14" fill="white">Physical AI</text>
</svg>